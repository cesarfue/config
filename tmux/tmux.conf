set -g window-size largest
set -g mouse on

############################ PREFIX ################################
unbind C-b
set-option -g prefix C-e
bind-key C-e send-prefix

########################## COPY MODE #############################

setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind P paste-buffer
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"


######################## split panes !! ###########################
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"
# set-option -g @ssh-split-h-key "|"
# set-option -g @ssh-split-v-key "_"
set-option -g @ssh-split-keep-cwd "true"
set-option -g @ssh-split-keep-remote-cwd "true"
set-option -g @ssh-split-strip-cmd "true"

bind-key 'x' kill-pane
unbind C-H
unbind C-/

#####################  SIDEKICK !! ##############################

# tmux display-message "Sidekick set to "$(tmux show-option -gqv @sidekick)""; \
#   if [ "$(tmux list-panes -a | wc -l | awk '{print $1}')" = "1" ]; then \
# tmux display-message "Condition met: only one pane"; \
# tmux set-option -g @sidekick 0; \
# fi; \

set -g @sidekick 0
bind-key -n 'C-_' run-shell '\
if [ "$(tmux show-option -gqv @sidekick)" = "0" ] ; then \
    tmux split-window -hb -c "#{pane_current_path}" -l 50; \
    tmux set-option -g @sidekick 1; \
elif [ "$(tmux show-option -gqv @sidekick)" = "1" ] ; then \
    tmux select-pane -t left; \
    tmux break-pane -d -n _SideKick; \
    tmux set-option -g @sidekick 2; \
elif  [ "$(tmux show-option -gqv @sidekick)" = "2" ]; then \
    tmux join-pane -s $.0 -hb -l 50; \
    tmux set-option -g @sidekick 1; \
fi'


################### Smart pane select and resize ##################

is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n 'C-Left' if-shell "$is_vim" 'send-keys C-Left' 'select-pane -L'
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-Down' if-shell "$is_vim" 'send-keys C-Down' 'select-pane -D'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-Up' if-shell "$is_vim" 'send-keys C-Up' 'select-pane -U'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-Right' if-shell "$is_vim" 'send-keys C-Right' 'select-pane -R'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'

if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -n 'C-e' if-shell "$is_vim" 'send-keys C-e' 'select-pane -t:.+'

bind-key -T copy-mode-vi 'C-Left' select-pane -L
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-Down' select-pane -D
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-Up' select-pane -U
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-Right' select-pane -R
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l
bind-key -T copy-mode-vi 'C-e' select-pane -t:.+

bind-key -n M-Left if-shell "$is_vim" "send-keys M-Left"  "resize-pane -L 3"
bind-key -n M-h if-shell "$is_vim" "send-keys M-h"  "resize-pane -L 3"
bind-key -n M-Down if-shell "$is_vim" "send-keys M-Down"  "resize-pane -D 3"
bind-key -n M-j if-shell "$is_vim" "send-keys M-j"  "resize-pane -D 3"
bind-key -n M-Up if-shell "$is_vim" "send-keys M-Up"  "resize-pane -U 3"
bind-key -n M-k if-shell "$is_vim" "send-keys M-k"  "resize-pane -U 3"
bind-key -n M-Right if-shell "$is_vim" "send-keys M-Right"  "resize-pane -R 3"
bind-key -n M-l if-shell "$is_vim" "send-keys M-l"  "resize-pane -R 3"

bind-key -T copy-mode-vi M-Left resize-pane -L 3
bind-key -T copy-mode-vi M-h resize-pane -L 3
bind-key -T copy-mode-vi M-Down resize-pane -D 3
bind-key -T copy-mode-vi M-j resize-pane -D 3
bind-key -T copy-mode-vi M-Up resize-pane -U 3
bind-key -T copy-mode-vi M-k resize-pane -U 3
bind-key -T copy-mode-vi M-Right resize-pane -R 3
bind-key -T copy-mode-vi M-l resize-pane -R 3


#####################  SESSIONIZER ##############################

# prefix+f : TUI sidecar — arbre des sessions, ouverture/création, fork, kill, rename.
bind-key f display-popup -w 80% -h 80% -E "sidecar"

# prefix+F : duplique la session courante — windows, conversation forkée, et son
# propre worktree quand le nom en désigne un.
bind-key F display-popup -w 60% -h 30% -E "sidecar fork"

# Ancien sessionizer bash+fzf, gardé en secours le temps de constater la parité.
bind-key C-f display-popup -E "~/.config/tmux/tmux-sessionizer.sh"

# prefix+C : nouvelle window dans le dossier courant, directement sur le
# sélecteur de discussions Claude Code (la window se ferme quand claude quitte).
bind-key C new-window -c "#{pane_current_path}" "claude --resume"

# Tuer la session courante bascule sur une autre au lieu de détacher le client.
set -g detach-on-destroy off

# prefix+R : renommer la session courante (équivalent du "$" natif, pré-rempli).
bind-key R command-prompt -I "#S" "rename-session '%%'"

# prefix+X : tuer la session courante, avec confirmation.
bind-key X confirm-before -p "tuer la session #S ? (y/n)" kill-session


############# DESIGN TWEAKS ############################################

set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# clock mode
setw -g clock-mode-colour yellow

# copy mode
setw -g mode-style 'fg=black bg=red bold'

# panes
set -g pane-border-style 'fg=red'
set -g pane-active-border-style 'fg=yellow'

set -g status off
# messages
set -g message-style 'fg=yellow bg=red bold'

############### PLUGINS #############################################

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'pschmitt/tmux-ssh-split'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Restauration au démarrage du serveur (la sauvegarde périodique, elle, passe
# par le timer systemd tmux-resurrect-save.timer : l'autosave de continuum
# s'appuie sur status-right, jamais évalué avec `status off`)
set -g @continuum-restore 'on'

# Le contenu affiché de chaque pane est sauvegardé et réaffiché au retour :
# sans cela, les sessions reviennent vides de tout ce qui s'y était passé.
set -g @resurrect-capture-pane-contents 'on'

# nvim est relancé sur sa session de travail (auto-session rouvre les fichiers
# du répertoire), et claude sur la commande exacte qui l'avait lancé — pour une
# session ouverte par sidecar, c'est `sidecar claude <session>`, qui reprend la
# conversation de cette session-là.
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-processes '"~claude" "~sidecar" "~nvim"'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
# Chemin explicite : tout s'installe dans ~/.config/tmux/plugins (versionné),
# plus rien dans ~/.tmux/plugins.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins/"
run '~/.config/tmux/plugins/tpm/tpm'
